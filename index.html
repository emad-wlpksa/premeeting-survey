<style>
:root{
  --purple:#9647FF;
  --purple-hover:#7A2EE6;
  --dark-purple:#4A378B;
  --charcoal:#242424;
  --stone:#E8E8E8;
  --tint:#F0E8FF;
  --gray4:#4B4B4B;
  --gray3:#727272;
  --gray2:#9A9A9A;
  --gray1:#C8C8C8;
  --cherry:#CD2873;
  --white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Arial,sans-serif;
  background:var(--white);
  color:#000;
  overflow:hidden;
}
html[lang="ar"] body{font-family:'Cairo',Arial,sans-serif}
/* ---------- decorative brand shapes ---------- */
.bg-shapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-shapes svg{position:absolute}
/* ---------- header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;
}
.logo svg{display:block;height:24px;width:auto}
.lang-toggle{
  display:flex;border:2px solid var(--charcoal);border-radius:10px;overflow:hidden;
  background:var(--white);
}
.lang-toggle button{
  border:none;background:transparent;padding:8px 16px;font-family:Arial,sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;color:#000;transition:.2s;
}
html[lang="ar"] .lang-toggle button{font-family:'Cairo',Arial,sans-serif}
.lang-toggle button.active{background:var(--purple);color:var(--white)}
/* ---------- progress ---------- */
.progress-wrap{position:fixed;top:0;left:0;right:0;height:5px;background:var(--stone);z-index:30}
.progress-bar{height:100%;background:var(--purple);width:0%;transition:width .4s cubic-bezier(.4,0,.2,1)}
[dir="rtl"] .progress-bar{margin-left:auto}
.step-count{
  position:fixed;top:74px;z-index:20;font-size:13px;font-weight:700;color:var(--gray2);
  left:50%;transform:translateX(-50%);letter-spacing:.06em;text-transform:uppercase;
}
[dir="rtl"] .step-count{letter-spacing:0;text-transform:none}
/* ---------- stage ---------- */
.stage{
  position:relative;z-index:10;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:96px 24px 110px;
}
.card{width:100%;max-width:640px}
.slide{animation:slideIn .38s cubic-bezier(.25,.8,.35,1) both}
.slide.out{animation:slideOut .22s ease both}
@keyframes slideIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-22px)}}
/* ---------- typography ---------- */
h1{
  font-weight:800;font-size:clamp(30px,5.2vw,50px);line-height:1.05;
  text-transform:uppercase;letter-spacing:-.01em;color:#000;margin-bottom:16px;
}
html[lang="ar"] h1{text-transform:none;letter-spacing:0;font-weight:900;line-height:1.3;font-size:clamp(27px,4.6vw,42px)}
h1 .accent{color:var(--purple)}
h2{
  font-weight:800;font-size:clamp(22px,3.4vw,30px);line-height:1.1;
  text-transform:uppercase;letter-spacing:-.01em;margin-bottom:8px;color:#000;
}
html[lang="ar"] h2{text-transform:none;letter-spacing:0;font-weight:800;line-height:1.4}
.sub{font-size:16px;line-height:1.5;color:var(--gray4);margin-bottom:26px}
/* ---------- option chips ---------- */
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{
  border:2px solid var(--stone);border-radius:10px;background:var(--white);cursor:pointer;
  padding:13px 18px;font-family:inherit;font-size:15.5px;font-weight:700;color:#000;
  transition:border-color .15s, background .15s, color .15s, transform .1s;
  text-align:start;
}
.opt:hover{border-color:var(--purple)}
.opt:active{transform:scale(.97)}
.opt.selected{background:var(--purple);border-color:var(--purple);color:var(--white)}
.opts.stacked{flex-direction:column}
.opts.stacked .opt{width:100%;padding:15px 18px}
.opt .tick{display:inline-block;width:1.2em;font-weight:900;opacity:0;transition:opacity .15s}
.opt.selected .tick{opacity:1}
/* checkbox squares for multi-select */
.opt.check{display:inline-flex;align-items:center;gap:11px}
.opts.stacked .opt.check{display:flex}
.cbox{
  flex:none;width:21px;height:21px;border:2px solid var(--gray1);border-radius:5px;
  background:var(--white);position:relative;transition:border-color .15s, background .15s;
}
.opt.check:hover .cbox{border-color:var(--purple)}
.opt.selected .cbox{background:var(--white);border-color:var(--white)}
.cbox svg{position:absolute;inset:2px;opacity:0;transition:opacity .15s}
.opt.selected .cbox svg{opacity:1}
.group-label{
  width:100%;font-size:13px;font-weight:700;color:var(--purple);
  text-transform:uppercase;letter-spacing:.08em;margin:14px 0 2px;
}
html[lang="ar"] .group-label{text-transform:none;letter-spacing:0}
.group-label:first-child{margin-top:0}
/* ---------- buttons ---------- */
.actions{display:flex;align-items:center;gap:16px;margin-top:28px}
.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;text-transform:uppercase;
  font-size:15px;letter-spacing:1.4px;padding:16px 36px;border-radius:10px;
  transition:transform .12s, background .2s;
}
html[lang="ar"] .btn{text-transform:none;letter-spacing:0;font-weight:800}
.btn-primary{background:var(--purple);color:var(--white)}
.btn-primary:hover{background:var(--purple-hover)}
.btn-primary:active{transform:scale(.97)}
.hint{font-size:12.5px;color:var(--gray2)}
.hint b{color:var(--gray3);font-weight:700}
.err-msg{font-size:13px;color:var(--cherry);margin-top:10px;display:none;font-weight:700}
.err-msg.show{display:block}
/* ---------- back arrow ---------- */
.back-fab{
  position:fixed;bottom:26px;z-index:20;border:2px solid var(--charcoal);border-radius:10px;
  background:var(--white);height:46px;padding:0 18px;cursor:pointer;
  font-family:inherit;font-size:14.5px;font-weight:700;color:#000;
  display:none;align-items:center;gap:9px;
}
.back-fab:hover{background:var(--stone)}
.back-fab .arr{font-size:19px;line-height:1}
[dir="ltr"] .back-fab{left:24px}
[dir="rtl"] .back-fab{right:24px}
.back-fab.show{display:inline-flex}
/* ---------- welcome / thanks ---------- */
.time-pill{
  display:inline-flex;align-items:center;gap:8px;margin-bottom:24px;
  background:var(--tint);border-radius:8px;padding:8px 16px;font-size:13.5px;font-weight:700;color:#000;
}
.time-pill svg{width:14px;height:14px;flex:none}
.thanks-shape{margin-bottom:26px}
.thanks-shape svg{width:96px;height:96px;display:block}
@media (max-width:520px){
  .stage{padding:86px 18px 100px}
  .btn{width:100%}
  .actions{flex-direction:column;align-items:stretch}
  .hint{text-align:center}
}
</style>
</head>

  recPlatforms:[
    {v:"Elevatus",en:"Elevatus",ar:"Elevatus"},
    {v:"Zoho Recruit",en:"Zoho Recruit",ar:"Zoho Recruit"},
    {v:"Manatal",en:"Manatal",ar:"Manatal"},
    {v:"Workable",en:"Workable",ar:"Workable"},
    {v:"Greenhouse",en:"Greenhouse",ar:"Greenhouse"},
    {v:"LinkedIn Recruiter",en:"LinkedIn Recruiter",ar:"LinkedIn Recruiter"},
    {v:"Oracle Taleo",en:"Oracle Taleo",ar:"Oracle Taleo"},
    {v:"Bayt.com",en:"Bayt.com",ar:"بيت.كوم"},
    {v:"Other recruitment platform",en:"Other",ar:"منصة أخرى"}
  ],
  modules:[
    {v:"Payroll",en:"Payroll",ar:"الرواتب"},
    {v:"Attendance & Shifts",en:"Attendance & Shifts",ar:"الحضور والمناوبات"},
    {v:"Leave Management",en:"Leave Management",ar:"الإجازات"},
    {v:"Employee Records",en:"Employee Records",ar:"سجلات الموظفين"},
    {v:"Hiring (ATS)",en:"Hiring (ATS)",ar:"التوظيف (ATS)"},
    {v:"Onboarding",en:"Onboarding",ar:"تهيئة الموظفين"},
    {v:"Performance",en:"Performance",ar:"تقييم الأداء"},
    {v:"Workflows & Automation",en:"Workflows & Automation",ar:"الأتمتة وسير العمل"}
  ],
  hiring:[
    {v:"Not hiring right now",en:"Not hiring right now",ar:"ما نوظف حاليًا"},
    {v:"1-10",en:"1–10 hires",ar:"١–١٠ موظفين"},
    {v:"11-50",en:"11–50 hires",ar:"١١–٥٠ موظف"},
    {v:"51-200",en:"51–200 hires",ar:"٥١–٢٠٠ موظف"},
    {v:"200+",en:"200+ hires",ar:"أكثر من ٢٠٠ موظف"}
  ],
  aiUsage:[
    {v:"Yes",en:"Yes, we use AI tools",ar:"نعم، نستخدمها"},
    {v:"Not yet",en:"Not yet",ar:"للحين لا"}
  ],
  aiTools:[
    {v:"ChatGPT",en:"ChatGPT",ar:"ChatGPT"},
    {v:"Claude",en:"Claude",ar:"Claude"},
    {v:"Gemini",en:"Gemini",ar:"Gemini"},
    {v:"Microsoft Copilot",en:"Microsoft Copilot",ar:"Microsoft Copilot"},
    {v:"Perplexity",en:"Perplexity",ar:"Perplexity"},
    {v:"Grok",en:"Grok",ar:"Grok"},
    {v:"DeepSeek",en:"DeepSeek",ar:"DeepSeek"},
    {v:"Replit",en:"Replit",ar:"Replit"},
    {v:"Lovable",en:"Lovable",ar:"Lovable"},
    {v:"Cursor",en:"Cursor",ar:"Cursor"},
    {v:"Other",en:"Other",ar:"أدوات أخرى"}
  ]
};
const NONE_CONSIDERING = {v:"None yet",en:"None yet",ar:"لا شيء بعد"};
const NONE_AI = {v:"None yet",en:"None yet",ar:"لا شيء بعد"};

/* ==================== steps ==================== */
const STEPS = [
  {id:"welcome", type:"welcome"},
  {id:"industry", type:"single", opts:"industry"},
  {id:"platformExp", type:"multi", opts:"platformExp", stacked:true, exclusive:"No"},
  {id:"hrUsed", type:"multi", opts:"hrPlatforms",
    cond:a=>(a.platformExp||[]).includes("HR platform")},
  {id:"recUsed", type:"multi", opts:"recPlatforms",
    cond:a=>(a.platformExp||[]).includes("Recruitment platform")},
  {id:"considering", type:"multi", groups:[
      {label:"grpHr", opts:"hrPlatforms"},
      {label:"grpRec", opts:"recPlatforms"}
    ], extra:NONE_CONSIDERING, exclusive:"None yet",
    cond:a=>(a.platformExp||[]).includes("No")},
  {id:"modules", type:"multi", opts:"modules"},
  {id:"hiring", type:"single", opts:"hiring"},
  {id:"aiUsage", type:"single", opts:"aiUsage", stacked:true},
  {id:"aiTools", type:"multi", opts:"aiTools",
    cond:a=>a.aiUsage==="Yes"},
  {id:"aiConsidering", type:"multi", opts:"aiTools", extra:NONE_AI, exclusive:"None yet",
    cond:a=>a.aiUsage==="Not yet"},
  {id:"thanks", type:"thanks"}
];

/* ==================== state ==================== */
let lang="en";
let idx=0;
const answers={};
const history=[];

function t(){return T[lang];}
function activeSteps(){return STEPS.filter(s=>!s.cond||s.cond(answers));}
function questionSteps(){return activeSteps().filter(s=>s.type!=="welcome"&&s.type!=="thanks");}

function setLang(l){
  lang=l;
  document.documentElement.lang=l==="ar"?"ar":"en";
  document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.getElementById("btn-en").classList.toggle("active",l==="en");
  document.getElementById("btn-ar").classList.toggle("active",l==="ar");
  render(false);
}

function progress(){
  const steps=activeSteps();
  const cur=steps[idx];
  const qs=questionSteps();
  const bar=document.getElementById("bar");
  const sc=document.getElementById("stepCount");
  if(cur.type==="welcome"){bar.style.width="0%";sc.textContent="";}
  else if(cur.type==="thanks"){bar.style.width="100%";sc.textContent="";}
  else{
    const qi=qs.indexOf(cur)+1;
    bar.style.width=(qi/(qs.length+1)*100)+"%";
    sc.textContent=t().stepOf(qi,qs.length);
  }
  const bb=document.getElementById("backBtn");
  bb.classList.toggle("show", idx>0 && cur.type!=="thanks");
  bb.querySelector(".arr").textContent = lang==="ar" ? "→" : "←";
  document.getElementById("backLabel").textContent = t().back;
}

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function optLabel(o){return lang==="ar"?o.ar:o.en;}

/* ==================== render ==================== */
function render(animate=true){
  const steps=activeSteps();
  if(idx>=steps.length) idx=steps.length-1;
  const s=steps[idx];
  const card=document.getElementById("card");
  const build=()=>{
    card.innerHTML=html(s);
    card.className="card slide";
    progress();
  };
  if(animate && card.firstChild){
    card.className="card slide out";
    setTimeout(build,170);
  } else build();
}

function html(s){
  const q=t().q[s.id]||{};
  if(s.type==="welcome"){
    const w=t().welcome;
    return `<div class="time-pill">
        <svg viewBox="0 0 156.5 156.5" fill="#9647FF"><path d="M 131.152344 0 L 25.308594 0 L 0 26.058594 L 25.300781 52.148438 L 0 78.21875 L 25.300781 104.308594 L 0 130.382812 L 25.28125 156.46875 L 131.191406 156.46875 L 156.476562 130.375 L 131.191406 104.308594 L 156.476562 78.210938 L 131.191406 52.148438 L 156.476562 26.050781 Z"/></svg>
        ${w.pill}</div>
      <h1>${w.h}</h1>
      <div class="actions" style="margin-top:34px"><button class="btn btn-primary" onclick="goNext()">${t().start}</button></div>`;
  }
  if(s.type==="thanks"){
    const th=t().thanks;
    return `<div class="thanks-shape">
      <svg viewBox="0 0 156.5 156.5">
        <path fill="#9647FF" d="M 101.410156 0 L 55.074219 0 L 54.789062 5.625 L 53.957031 11.089844 L 52.605469 16.375 L 50.753906 21.445312 L 48.433594 26.277344 L 45.675781 30.828125 L 42.507812 35.089844 L 38.953125 39.019531 L 35.042969 42.605469 L 30.804688 45.804688 L 26.269531 48.589844 L 21.453125 50.933594 L 16.390625 52.8125 L 11.113281 54.199219 L 5.636719 55.058594 L 0 55.367188 L 0 101.117188 L 5.632812 101.425781 L 11.105469 102.285156 L 16.382812 103.671875 L 21.445312 105.550781 L 26.261719 107.894531 L 30.796875 110.679688 L 35.035156 113.878906 L 38.945312 117.457031 L 42.503906 121.390625 L 45.675781 125.65625 L 48.433594 130.21875 L 50.753906 135.046875 L 52.605469 140.117188 L 53.957031 145.402344 L 54.789062 150.871094 L 55.074219 156.492188 L 101.410156 156.492188 L 101.695312 150.871094 L 102.527344 145.402344 L 103.882812 140.117188 L 105.730469 135.046875 L 108.050781 130.21875 L 110.808594 125.65625 L 113.976562 121.394531 L 117.53125 117.464844 L 121.441406 113.886719 L 125.679688 110.6875 L 130.21875 107.902344 L 135.03125 105.558594 L 140.09375 103.679688 L 145.375 102.292969 L 150.847656 101.433594 L 156.476562 101.125 L 156.476562 55.367188 L 150.847656 55.058594 L 145.375 54.199219 L 140.09375 52.8125 L 135.03125 50.933594 L 130.21875 48.589844 L 125.679688 45.804688 L 121.441406 42.605469 L 117.53125 39.027344 L 113.976562 35.097656 L 110.808594 30.835938 L 108.050781 26.277344 L 105.730469 21.445312 L 103.882812 16.375 L 102.527344 11.089844 L 101.695312 5.625 Z"/>
        <path d="M 52 78.5 L 70 96.5 L 104 62" stroke="#fff" stroke-width="10" fill="none"/>
      </svg></div>
      <h1>${th.h}</h1>`;
  }
  let body="";
  if(s.type==="single"){
    body=chips(s);
  }
  if(s.type==="multi"){
    body=chips(s)+`<div class="actions"><button class="btn btn-primary" onclick="goNext()">${t().next}</button>
      <span class="hint"><b>${t().pickMany}</b></span></div>`;
  }
  const sub=q.sub?`<p class="sub">${q.sub}</p>`:`<div style="height:18px"></div>`;
  return `<h2>${q.h}</h2>${sub}${body}<div class="err-msg" id="e_step"></div>`;
}

function chips(s){
  const multi=s.type==="multi";
  const sel=answers[s.id]||(multi?[]:null);
  const isSel=v=> multi ? sel.includes(v) : sel===v;
  const cbox=`<span class="cbox"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 L10 18 L20 7" stroke="#9647FF" stroke-width="3.4"/></svg></span>`;
  const chip=o=>`<button class="opt ${multi?'check':''} ${isSel(o.v)?'selected':''}"
      onclick="pick('${s.id}','${esc(o.v)}',${multi},'${s.exclusive||''}')">
      ${multi?cbox:`<span class="tick">✓</span>`}${optLabel(o)}</button>`;
  let inner="";
  if(s.groups){
    for(const g of s.groups){
      inner+=`<div class="group-label">${t()[g.label]}</div>`;
      inner+=OPTS[g.opts].map(chip).join("");
    }
    if(s.extra) inner+=`<div class="group-label">&nbsp;</div>`+chip(s.extra);
  }else{
    let list=[...OPTS[s.opts]];
    if(s.extra) list.push(s.extra);
    inner=list.map(chip).join("");
  }
  return `<div class="opts ${s.stacked?'stacked':''}">${inner}</div>`;
}

/* ==================== interactions ==================== */
function pick(id,v,multi,exclusive){
  if(multi){
    let arr=answers[id]||[];
    if(exclusive && v===exclusive){ arr=arr.includes(v)?[]:[v]; }
    else{
      if(exclusive) arr=arr.filter(x=>x!==exclusive);
      arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
    }
    answers[id]=arr;
    render(false);
  }else{
    answers[id]=v;
    render(false);
    setTimeout(goNext,260); // auto-advance
  }
}

function showErr(msg){
  const el=document.getElementById("e_step");
  if(el){el.textContent=msg;el.classList.add("show");}
}

function validate(s){
  if(s.type==="single" && !answers[s.id]){showErr(t().required);return false;}
  if(s.type==="multi" && !(answers[s.id]||[]).length){showErr(t().required);return false;}
  return true;
}

/* clear answers of branches that are no longer active */
function cleanupBranches(){
  const exp=answers.platformExp||[];
  if(!exp.includes("HR platform")) delete answers.hrUsed;
  if(!exp.includes("Recruitment platform")) delete answers.recUsed;
  if(!exp.includes("No")) delete answers.considering;
  if(answers.aiUsage!=="Yes") delete answers.aiTools;
  if(answers.aiUsage!=="Not yet") delete answers.aiConsidering;
}

function goNext(){
  const steps=activeSteps();
  const s=steps[idx];
  if(s.type!=="welcome" && s.type!=="thanks" && !validate(s)) return;
  cleanupBranches();
  history.push(s.id);
  const ns=activeSteps();
  const ci=ns.findIndex(x=>x.id===s.id);
  idx=Math.min(ci+1,ns.length-1);
  if(ns[idx].type==="thanks") submit();
  render(true);
}

function goBack(){
  if(!history.length){ if(idx>0){idx--;render(true);} return; }
  const prevId=history.pop();
  const ns=activeSteps();
  idx=Math.max(ns.findIndex(x=>x.id===prevId),0);
  render(true);
}

/* ==================== submit ==================== */
function submit(){
  answers.language = lang==="ar"?"Arabic":"English";
  console.log("Survey answers:",JSON.parse(JSON.stringify(answers)));
  if(!GOOGLE_FORM.action) return;
  const fd=new FormData();
  const E=GOOGLE_FORM.entries;
  const one=(k,val)=>{ if(E[k]&&val) fd.append(E[k],val); };
  const many=(k,arr)=>{ (arr||[]).forEach(v=>{ if(E[k]) fd.append(E[k],v); }); };
  one("industry",answers.industry);
  many("platformExp",answers.platformExp);
  many("hrUsed",answers.hrUsed);
  many("recUsed",answers.recUsed);
  many("considering",answers.considering);
  many("modules",answers.modules);
  one("hiring",answers.hiring);
  one("aiUsage",answers.aiUsage);
  many("aiTools",answers.aiTools);
  many("aiConsidering",answers.aiConsidering);
  one("language",answers.language);
  fetch(GOOGLE_FORM.action,{method:"POST",mode:"no-cors",body:fd})
    .catch(err=>console.warn("Submit failed:",err));
}

/* detect browser language once */
if((navigator.language||"").toLowerCase().startsWith("ar")) setLang("ar"); else render(false);
</script>
